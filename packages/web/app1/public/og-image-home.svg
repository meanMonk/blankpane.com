<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#151a3d"/>
      <stop offset="1" stop-color="#232a63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c8bff"/>
      <stop offset="1" stop-color="#4c6fff"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- ambient glow accents -->
  <circle cx="120" cy="80" r="180" fill="#4c6fff" opacity="0.25" filter="url(#soft)"/>
  <circle cx="1120" cy="560" r="220" fill="#7c5cff" opacity="0.2" filter="url(#soft)"/>

  <!-- subtle grid texture -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
  </g>

  <!-- left content block -->
  <g>
    <!-- mark: rounded square outline echoing a "pane" -->
    <rect x="80" y="96" width="56" height="56" rx="14" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <rect x="96" y="112" width="24" height="24" rx="6" fill="url(#accent)"/>

    <text x="150" y="140" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ffffff">BlankPane</text>

    <text x="80" y="222" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="800" fill="#ffffff">
      <tspan x="80" dy="0">White Screen,</tspan>
      <tspan x="80" dy="58">Black Screen &amp;</tspan>
      <tspan x="80" dy="58">Color Screen Tool</tspan>
    </text>

    <text x="80" y="428" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#b9c2ff" opacity="0.9">
      <tspan x="80" dy="0">Free full-screen backgrounds for lighting, Zoom</tspan>
      <tspan x="80" dy="32">calls, monitor testing &amp; dead-pixel checks.</tspan>
    </text>

    <!-- url pill -->
    <rect x="80" y="494" width="230" height="48" rx="24" fill="#ffffff" opacity="0.08"/>
    <text x="105" y="525" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#ffffff">blankpane.com</text>
  </g>

  <!-- right swatch grid representing the tool's core colors -->
  <g transform="translate(830,120)">
    <!-- row 1 -->
    <rect x="0" y="0" width="130" height="130" rx="20" fill="#ffffff"/>
    <rect x="150" y="0" width="130" height="130" rx="20" fill="#0e0e12" stroke="#3a3f55" stroke-width="2"/>
    <!-- row 2 -->
    <rect x="0" y="150" width="130" height="130" rx="20" fill="#22c55e"/>
    <rect x="150" y="150" width="130" height="130" rx="20" fill="#3b82f6"/>
    <!-- row 3 -->
    <rect x="0" y="300" width="130" height="130" rx="20" fill="#ec4899"/>
    <rect x="150" y="300" width="130" height="130" rx="20" fill="#f59e0b"/>
  </g>
</svg>
